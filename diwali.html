<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Diwali Diya Wishes — Shubh Deepawali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Mukta:wght@400;500;600;700&family=Rozha+One&family=Yatra+One&display=swap">
  <style>
    /* Handcrafted Royal Indian Festive Theme — Warm Deepawali Night & Glowing Jharokha Cards */
    :root {
      --night: #120509;
      --velvet: #220810;
      --maroon: #460d1b;
      --sindoor: #6e1423;
      --amber-glow: #ff8c1a;
      --gold: #e8a838;
      --gold-hi: #ffebb3;
      --gold-deep: #b37418;
      --flame: #ff9a1f;
      --cream: #fff6e5;
      --cream-soft: rgba(255, 244, 222, 0.86);
      --rani: #d9386a;
      --peacock: #1ca69e;
      --display: "Yatra One", "Rozha One", serif;
      --serif: "Cormorant Garamond", Georgia, serif;
      --body: "Mukta", system-ui, -apple-system, sans-serif;
      --gx: max(16px, env(safe-area-inset-left, 0px));
      --gy: max(16px, env(safe-area-inset-right, 0px));
      --zone: clamp(120px, 20vh, 215px);
      color-scheme: dark;
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    [hidden]:not([hidden="until-found" i]) {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 145, 35, 0.22) 0%, rgba(180, 45, 30, 0.12) 34%, transparent 68%),
        radial-gradient(circle at 15% 80%, rgba(217, 56, 106, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 85% 78%, rgba(232, 168, 56, 0.14) 0%, transparent 50%),
        linear-gradient(180deg, #110408 0%, #210811 42%, #330b18 78%, #1a060d 100%);
      background-color: var(--night);
      color: var(--cream);
      font-family: var(--body);
      font-size: 17px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }

    /* Decorative ambient mandala & warm festive bokeh background */
    #ambientBg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* Subtle woven Zari / silk brocade texture overlay */
    #ambientBg::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.28;
      background-image:
        radial-gradient(rgba(255, 215, 130, 0.16) 1px, transparent 1px),
        radial-gradient(rgba(255, 160, 60, 0.1) 1px, transparent 1px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
    }

    /* Warm vignette frame */
    #ambientBg::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 110px rgba(8, 2, 4, 0.85);
    }

    .bgMandala {
      position: absolute;
      left: 50%;
      top: 23%;
      width: min(88vmin, 560px);
      height: min(88vmin, 560px);
      transform: translate(-50%, -50%);
      opacity: 0.13;
      animation: slowSpin 95s linear infinite;
      filter: drop-shadow(0 0 18px rgba(255, 175, 60, 0.35));
    }

    body.opened .bgMandala {
      top: 22%;
      opacity: 0.18;
    }

    @keyframes slowSpin {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #fff8e0 0%, #f4b53f 60%, transparent 100%);
      opacity: 0.75;
      animation: tw 3.4s ease-in-out infinite;
    }

    .bokeh {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 200, 105, 0.32) 0%, rgba(255, 130, 30, 0.12) 55%, transparent 75%);
      filter: blur(2px);
      animation: floatOrb linear infinite;
    }

    @keyframes tw {
      50% {
        opacity: 0.18;
        transform: scale(0.75);
      }
    }

    @keyframes floatOrb {
      0% {
        transform: translateY(0) scale(0.95);
        opacity: 0.2;
      }

      50% {
        transform: translateY(-28px) scale(1.08);
        opacity: 0.55;
      }

      100% {
        transform: translateY(-56px) scale(0.95);
        opacity: 0.2;
      }
    }

    #gl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      touch-action: none;
    }

    #halo {
      position: fixed;
      left: 0;
      top: 0;
      width: 145vmin;
      height: 145vmin;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
      background: radial-gradient(circle,
          rgba(255, 195, 90, 0.65) 0%,
          rgba(255, 135, 35, 0.3) 26%,
          rgba(195, 45, 55, 0.11) 52%,
          transparent 70%);
    }

    /* Carved Royal Haveli / Temple Doors */
    #doors {
      position: fixed;
      inset: 0;
      z-index: 3;
      perspective: 1400px;
      overflow: hidden;
    }

    .ambient-glow {
      position: fixed;
      left: 50%;
      bottom: -40px;
      transform: translateX(-50%);
      width: min(950px, 110vw);
      height: 340px;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 90%,
          rgba(255, 175, 45, 0.52) 0%,
          rgba(255, 110, 20, 0.26) 42%,
          rgba(180, 35, 35, 0.08) 70%,
          transparent 85%);
      mix-blend-mode: screen;
      animation: ambientPulse 3.2s ease-in-out infinite alternate;
      transition: opacity 1s;
    }

    body.opened .ambient-glow {
      opacity: 0.35;
    }

    @keyframes ambientPulse {
      from {
        opacity: 0.78;
        transform: translateX(-50%) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) scale(1.04);
      }
    }

    .door {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50.2%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 5vh, 52px) clamp(22px, 4vw, 48px) clamp(110px, 16vh, 145px);
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 165, 55, 0.16), transparent 65%),
        repeating-linear-gradient(90deg, rgba(255, 210, 120, 0.03) 0 2px, transparent 2px 18px),
        linear-gradient(180deg, #2d0711 0%, #520f20 48%, #26060e 100%);
      transition: transform 1.65s cubic-bezier(0.68, 0, 0.18, 1);
      backface-visibility: hidden;
      box-shadow: inset 0 0 55px rgba(0, 0, 0, 0.8);
      gap: 18px;
    }

    .door::before {
      content: "";
      position: absolute;
      inset: 14px 14px;
      border: 1.5px solid rgba(232, 168, 56, 0.7);
      border-radius: 12px;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 5px rgba(34, 6, 14, 0.9),
        inset 0 0 0 6.5px rgba(232, 168, 56, 0.38),
        0 0 25px rgba(0, 0, 0, 0.5);
    }

    .door-inset {
      position: relative;
      flex: 1;
      border-radius: 10px;
      border: 1.5px solid rgba(244, 181, 63, 0.58);
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 175, 60, 0.12) 0%, rgba(22, 4, 10, 0.68) 85%),
        repeating-linear-gradient(45deg, rgba(255, 215, 130, 0.03) 0 2px, transparent 2px 14px);
      box-shadow:
        inset 0 4px 18px rgba(0, 0, 0, 0.85),
        inset 0 0 0 4px rgba(45, 8, 18, 0.85),
        inset 0 0 0 5px rgba(244, 181, 63, 0.28),
        0 1px 0 rgba(255, 230, 160, 0.25);
    }

    .door-inset::after {
      content: "✦";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: rgba(255, 220, 130, 0.38);
      text-shadow: 0 0 10px rgba(255, 165, 45, 0.35);
    }

    .door-handle {
      position: absolute;
      top: 46%;
      width: 20px;
      height: 68px;
      margin-top: -34px;
      border-radius: 10px;
      background: linear-gradient(180deg, var(--gold-hi), var(--gold), #8c5308);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.8), 0 0 14px rgba(244, 181, 63, 0.45);
      z-index: 2;
    }

    .door-handle::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 3px solid var(--gold-hi);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
    }

    .door.l {
      left: 0;
      transform-origin: left center;
      border-right: 2px solid var(--gold);
    }

    .door.l .door-handle {
      right: 24px;
    }

    .door.r {
      right: 0;
      transform-origin: right center;
      border-left: 2px solid var(--gold);
    }

    .door.r .door-handle {
      left: 24px;
    }

    #doors.open .l {
      transform: rotateY(84deg);
    }

    #doors.open .r {
      transform: rotateY(-84deg);
    }

    /* Bottom Temple Staircase with Glowing Diyas */
    .step-container {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(760px, 100vw);
      pointer-events: none;
      transition: transform 1.1s cubic-bezier(0.5, 0, 0.2, 1), opacity 0.9s;
    }

    body.opened .step-container {
      transform: translateX(-50%) translateY(110%);
      opacity: 0;
      pointer-events: none;
    }

    .step {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: auto;
      background:
        linear-gradient(90deg, rgba(255, 195, 90, 0.14) 0%, rgba(255, 225, 140, 0.28) 50%, rgba(255, 195, 90, 0.14) 100%),
        linear-gradient(180deg, #5c1628 0%, #380b18 55%, #1f050d 100%);
      border-top: 2px solid #f7c65b;
      border-left: 1.5px solid rgba(244, 181, 63, 0.55);
      border-right: 1.5px solid rgba(244, 181, 63, 0.55);
      border-radius: 8px 8px 0 0;
      box-shadow:
        inset 0 2px 10px rgba(255, 200, 95, 0.35),
        0 -4px 18px rgba(0, 0, 0, 0.65),
        0 0 24px rgba(255, 145, 30, 0.2);
    }

    .step::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 4px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 238, 185, 0.65), transparent);
    }

    .step-1 {
      width: min(460px, 78vw);
      height: 26px;
      z-index: 1;
    }

    .step-2 {
      width: min(590px, 90vw);
      height: 30px;
      z-index: 2;
    }

    .step-3 {
      width: min(720px, 98vw);
      height: 34px;
      z-index: 3;
    }

    /* Step Diyas & Flickering Flames */
    .step .diya {
      position: absolute;
      bottom: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
    }

    .step .diya:hover {
      transform: scale(1.12);
    }

    .diya-bowl {
      width: 44px;
      height: 20px;
      border-radius: 3px 3px 24px 24px;
      background:
        radial-gradient(ellipse at 50% 15%, #ffbe45 0%, #c9561e 48%, #6e2209 100%);
      border-top: 2px solid #ffe699;
      border-bottom: 1.5px solid #f4b53f;
      box-shadow:
        inset 0 2px 5px rgba(255, 230, 150, 0.55),
        0 4px 10px rgba(0, 0, 0, 0.75),
        0 0 14px rgba(255, 150, 30, 0.45);
      position: relative;
    }

    .diya-bowl::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      top: 45%;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 230, 160, 0.7);
    }

    .step .diya .flame {
      position: absolute;
      bottom: 16px;
      width: 14px;
      height: 24px;
      border-radius: 50% 50% 35% 35% / 65% 65% 35% 35%;
      background: radial-gradient(ellipse at 50% 72%, #ffffff 0%, #fff1a8 35%, #ff9a1f 72%, rgba(255, 90, 0, 0) 100%);
      box-shadow:
        0 0 12px 3px rgba(255, 180, 55, 0.85),
        0 0 26px 8px rgba(255, 125, 20, 0.45);
      transform-origin: center bottom;
      animation: stepFlameFlicker 1.25s ease-in-out infinite alternate;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .step .diya .flame.flare {
      transform: scale(1.55) !important;
      filter: brightness(1.38) drop-shadow(0 0 14px #fff6cc);
    }

    @keyframes stepFlameFlicker {
      0% {
        transform: scale(0.96, 0.95) rotate(-2deg);
      }

      50% {
        transform: scale(1.04, 1.06) rotate(1.5deg);
      }

      100% {
        transform: scale(0.98, 1.08) rotate(-1deg);
      }
    }

    /* Diya Placements on the 3 Steps */
    .diya.s1-l {
      left: 20px;
    }

    .diya.s1-r {
      right: 20px;
    }

    .diya.s2-l1 {
      left: 30px;
    }

    .diya.s2-l2 {
      left: 110px;
    }

    .diya.s2-r1 {
      right: 30px;
    }

    .diya.s2-r2 {
      right: 110px;
    }

    .diya.s3-l1 {
      left: 40px;
    }

    .diya.s3-c {
      left: 50%;
      transform: translateX(-50%);
    }

    .diya.s3-r1 {
      right: 40px;
    }

    .diya.s3-c:hover {
      transform: translateX(-50%) scale(1.12);
    }

    /* Responsive adjustments for steps */
    @media (max-width: 600px) {
      .step-container {
        transform: translateX(-50%) scale(0.85);
        transform-origin: bottom center;
      }

      body.opened .step-container {
        transform: translateX(-50%) translateY(110%) scale(0.85);
      }

      .diya.s2-l2 {
        left: 82px;
      }

      .diya.s2-r2 {
        right: 82px;
      }
    }

    @media (max-width: 400px) {
      .step-container {
        transform: translateX(-50%) scale(0.7);
        transform-origin: bottom center;
      }

      body.opened .step-container {
        transform: translateX(-50%) translateY(110%) scale(0.7);
      }
    }

    /* Intro overlay */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(28px, env(safe-area-inset-top, 0px)) var(--gx) max(32px, env(safe-area-inset-bottom, 0px)) var(--gy);
      transition: opacity 0.8s;
    }

    #intro.gone {
      opacity: 0;
      pointer-events: none;
    }

    .greetBig {
      margin-top: 7vh;
      font-family: var(--display);
      font-size: clamp(36px, 9vw, 66px);
      line-height: 1.15;
      text-align: center;
      opacity: 0;
      background: linear-gradient(180deg, #fff5d6 0%, var(--gold-hi) 35%, var(--gold) 70%, #b86b11 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-wrap: balance;
      transition: opacity 0.5s;
      filter: drop-shadow(0 4px 16px rgba(255, 145, 25, 0.45)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85));
    }

    .lit .greetBig {
      opacity: 1;
    }

    .pop {
      animation: pop 0.38s cubic-bezier(0.2, 1.6, 0.4, 1);
    }

    @keyframes pop {
      from {
        transform: scale(0.86);
        opacity: 0.3;
      }
    }

    .introBottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: clamp(92px, 14vh, 118px);
      transition: opacity 0.5s;
      pointer-events: auto;
      background: radial-gradient(circle, rgba(34, 8, 16, 0.78) 0%, transparent 78%);
      padding: 12px 24px;
      border-radius: 28px;
    }

    .lit .introBottom {
      opacity: 0;
      pointer-events: none;
    }

    .hint {
      margin: 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: 19px;
      letter-spacing: 0.02em;
      color: var(--gold-hi);
      opacity: 0.92;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    /* Festive Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1.5px solid rgba(232, 168, 56, 0.75);
      background: linear-gradient(180deg, rgba(82, 16, 32, 0.88), rgba(38, 8, 18, 0.94));
      box-shadow:
        inset 0 1px 0 rgba(255, 235, 179, 0.25),
        0 4px 14px rgba(0, 0, 0, 0.45);
      text-decoration: none;
      font-weight: 600;
      color: var(--cream);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--gold-hi);
      box-shadow:
        inset 0 1px 0 rgba(255, 235, 179, 0.4),
        0 6px 18px rgba(255, 150, 40, 0.28);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.gold {
      background: linear-gradient(180deg, #fff0bd 0%, #f5bc47 48%, #c97c16 100%);
      color: #381500;
      border-color: #fff3c4;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow:
        inset 0 1px 1px #fff,
        0 6px 24px rgba(255, 154, 31, 0.5);
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        box-shadow:
          inset 0 1px 1px #fff,
          0 0 0 10px rgba(244, 181, 63, 0),
          0 0 32px 6px rgba(255, 165, 50, 0.65);
      }
    }

    .btn:focus-visible,
    .chip:focus-visible,
    .ic:focus-visible,
    .dot:focus-visible,
    input:focus-visible {
      outline: 2.5px solid var(--gold-hi);
      outline-offset: 2px;
    }

    /* Main Stage */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.1s 0.4s, transform 1.1s 0.4s;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    body.opened #stage {
      z-index: 5;
      opacity: 1;
      transform: none;
    }

    /* Marigold & Mango Leaf Toran Garland */
    .garland {

    /* Top Bar */
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px var(--gy) 0 var(--gx);
      flex: none;
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      min-width: 0;
      padding: 2px;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 1;
      max-width: 150px;
      min-height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1.5px solid rgba(232, 168, 56, 0.5);
      background: rgba(45, 10, 22, 0.72);
      backdrop-filter: blur(8px);
      font-size: 15px;
      white-space: nowrap;
      transition: all 0.25s;
    }

    .chip[aria-pressed="true"] {
      background: linear-gradient(180deg, var(--gold-hi), var(--gold));
      color: #381500;
      border-color: #fff2c2;
      font-weight: 700;
      box-shadow: 0 0 16px rgba(244, 181, 63, 0.45);
    }

    .ic {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(232, 168, 56, 0.55);
      background: rgba(45, 10, 22, 0.75);
      backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      padding: 0;
      transition: all 0.2s;
    }

    .ic:hover:not(:disabled) {
      border-color: var(--gold-hi);
      box-shadow: 0 0 14px rgba(244, 181, 63, 0.35);
    }

    .ic svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: var(--gold-hi);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ic[aria-pressed="true"] {
      background: linear-gradient(180deg, var(--gold-hi), var(--gold));
      border-color: #fff2c2;
    }

    .ic[aria-pressed="true"] svg {
      stroke: #381500;
    }

    #tourBtn[aria-pressed="true"] svg {
      animation: spin 2.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .count {
      margin: 4px 0 0;
      text-align: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      letter-spacing: 0.04em;
      color: var(--gold-hi);
      text-shadow: 0 1px 8px rgba(255, 150, 30, 0.45);
      flex: none;
      min-height: 22px;
    }

    /* Interactive 3D Diya Spacer Zone */
    .spacer {
      flex: none;
      height: var(--zone);
      cursor: grab;
      touch-action: pan-y;
    }

    .spacer:active {
      cursor: grabbing;
    }

    /* Wish Slider & Handcrafted Glowing Jharokha Card */
    .slider {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
    }

    .track {
      --sw: min(88vw, 430px);
      display: flex;
      gap: 18px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      position: absolute;
      inset: 0 0 4px 0;
      padding: 6px calc((100% - var(--sw)) / 2);
      cursor: grab;
    }

    .track::-webkit-scrollbar {
      display: none;
    }

    .slide {
      flex: 0 0 var(--sw);
      scroll-snap-align: center;
      display: flex;
      min-width: 0;
      height: 100%;
    }

    /* Ornate Jharokha / Palace Arch Card — High-Richness Royal Jewel & Banarasi Silk Combinations */
    .card {
      --c-crown: rgba(255, 165, 45, 0.48);
      --c-top: #a8144b;
      --c-mid: #5e0b35;
      --c-bot: #2b061e;
      --c-glow: rgba(235, 55, 115, 0.42);
      --c-btn: rgba(145, 20, 68, 0.78);
      position: relative;
      box-sizing: border-box;
      flex: 1;
      max-height: min(100%, 510px);
      margin: auto 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      text-align: center;
      padding: clamp(28px, 5.2vh, 46px) 24px 16px;
      overflow-y: auto;
      scrollbar-width: none;
      border-radius: 50% 50% 24px 24px / 118px 118px 24px 24px;
      background:
        /* Radiant golden-saffron crown spotlight under the 3D diya */
        radial-gradient(circle at 50% 14%, var(--c-crown) 0%, rgba(255, 185, 70, 0.16) 36%, transparent 68%),
        /* Dual corner jewel highlights */
        radial-gradient(circle at 12% 88%, var(--c-glow) 0%, transparent 55%),
        radial-gradient(circle at 88% 88%, rgba(255, 175, 45, 0.25) 0%, transparent 55%),
        /* Intricate Banarasi Zari gold lattice weave */
        repeating-linear-gradient(45deg, rgba(255, 225, 150, 0.045) 0 1.5px, transparent 1.5px 14px),
        repeating-linear-gradient(-45deg, rgba(255, 225, 150, 0.045) 0 1.5px, transparent 1.5px 14px),
        /* High-richness 3-stop Royal Jewel Silk gradient */
        linear-gradient(168deg, var(--c-top) 0%, var(--c-mid) 52%, var(--c-bot) 100%);
      border: 2.5px solid #f7c355;
      box-shadow:
        inset 0 0 0 5px rgba(22, 4, 14, 0.82),
        inset 0 0 0 7px rgba(255, 225, 145, 0.68),
        inset 0 16px 42px rgba(255, 195, 80, 0.28),
        0 16px 44px rgba(0, 0, 0, 0.75),
        0 0 34px var(--c-glow);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s, box-shadow 0.5s;
    }

    /* 6 Distinct Royal Indian Festive Jewel Palettes per Slide */
    /* 1: Sacred Light — Royal Paithani Rani Pink, Kumkum Crimson & Molten Saffron */
    .slide[data-theme="0"] .card {
      --c-crown: rgba(255, 175, 50, 0.55);
      --c-top: #b8184e;
      --c-mid: #6b0d3b;
      --c-bot: #2d0521;
      --c-glow: rgba(240, 60, 115, 0.45);
      --c-btn: rgba(135, 18, 62, 0.78);
    }

    /* 2: Auspicious Prosperity — Mayur Peacock Emerald, Royal Teal & Kundan Gold */
    .slide[data-theme="1"] .card {
      --c-crown: rgba(255, 200, 75, 0.5);
      --c-top: #0d8276;
      --c-mid: #084c57;
      --c-bot: #052233;
      --c-glow: rgba(26, 190, 170, 0.45);
      --c-btn: rgba(10, 92, 96, 0.8);
    }

    /* 3: Sweet Celebrations — Kesar Marigold, Royal Vermilion & Deep Ruby */
    .slide[data-theme="2"] .card {
      --c-crown: rgba(255, 210, 85, 0.58);
      --c-top: #cc3b18;
      --c-mid: #7d151e;
      --c-bot: #360612;
      --c-glow: rgba(255, 115, 40, 0.48);
      --c-btn: rgba(148, 32, 26, 0.8);
    }

    /* 4: Radiant Beginnings — Royal Amethyst, Jamuni Orchid & Rose Gold */
    .slide[data-theme="3"] .card {
      --c-crown: rgba(255, 175, 95, 0.5);
      --c-top: #881c7a;
      --c-mid: #47105c;
      --c-bot: #1f0633;
      --c-glow: rgba(195, 65, 180, 0.45);
      --c-btn: rgba(102, 20, 108, 0.8);
    }

    /* 5: Joyful & Mindful — Jodhpur Royal Sapphire, Meenakari Indigo & Amber Gold */
    .slide[data-theme="4"] .card {
      --c-crown: rgba(255, 195, 80, 0.5);
      --c-top: #18589e;
      --c-mid: #122d6b;
      --c-bot: #091338;
      --c-glow: rgba(55, 135, 235, 0.45);
      --c-btn: rgba(22, 62, 128, 0.8);
    }

    /* 6: Share the Blessing — Festive Bandhani Magenta, Coral Rose & Imperial Gold */
    .slide[data-theme="5"] .card {
      --c-crown: rgba(255, 190, 65, 0.55);
      --c-top: #a61762;
      --c-mid: #5c104c;
      --c-bot: #260629;
      --c-glow: rgba(235, 70, 145, 0.48);
      --c-btn: rgba(125, 20, 82, 0.8);
    }

    .card::-webkit-scrollbar {
      display: none;
    }

    .slide.on .card {
      box-shadow:
        inset 0 0 0 5px rgba(22, 4, 14, 0.8),
        inset 0 0 0 7px rgba(255, 232, 158, 0.82),
        inset 0 18px 46px rgba(255, 195, 80, 0.32),
        0 18px 50px rgba(0, 0, 0, 0.78),
        0 0 42px var(--c-glow),
        0 -8px 28px rgba(255, 190, 75, 0.28);
    }

    .slide:not(.on) .card {
      transform: scale(0.92);
      opacity: 0.58;
    }

    /* Ornate Mandala Halo behind Card Sticker & Golden Corner Brackets */
    .cardMandala {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 156px;
      height: 156px;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.28;
    }

    .cardCorner {
      position: absolute;
      bottom: 12px;
      width: 34px;
      height: 34px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }

    .cardCorner.bl {
      left: 12px;
    }

    .cardCorner.br {
      right: 12px;
      transform: scaleX(-1);
    }

    .cardBody {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
      width: 100%;
    }

    .stk {
      width: clamp(72px, 11.5vh, 102px);
      height: auto;
      flex: none;
      overflow: visible;
      filter: drop-shadow(0 6px 14px rgba(255, 145, 30, 0.35));
    }

    .tag {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(23px, 3.6vh + 8px, 33px);
      line-height: 1.18;
      background: linear-gradient(180deg, #fff7df 0%, var(--gold-hi) 45%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-wrap: balance;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
    }

    .divider {
      width: 140px;
      height: 12px;
      flex: none;
      opacity: 0.85;
    }

    .dear {
      margin: 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: 19px;
      font-weight: 600;
      color: var(--gold-hi);
    }

    .wish {
      margin: 0;
      font-family: var(--body);
      font-size: clamp(15.5px, 2.1vh, 17.5px);
      line-height: 1.55;
      color: var(--cream);
      text-wrap: pretty;
      max-width: 31ch;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .sign {
      margin: 2px 0 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: 16px;
      color: var(--gold-hi);
      opacity: 0.9;
    }

    .acts {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 222, 138, 0.32);
      width: 100%;
    }

    .acts .btn {
      min-height: 34px;
      padding: 0 13px;
      font-size: 13.5px;
      gap: 6px;
      background: linear-gradient(180deg, var(--c-btn), rgba(20, 4, 14, 0.92));
      border-color: rgba(255, 222, 138, 0.72);
    }

    .acts .btn svg {
      width: 14px;
      height: 14px;
      stroke: var(--gold-hi);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Footer navigation */
    .foot {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px var(--gy) 12px var(--gx);
    }

    .dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      background: none;
      border: 0;
      padding: 0;
    }

    .dot i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 235, 179, 0.32);
      transition: all 0.3s;
    }

    .dot[aria-current="true"] i {
      width: 22px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--gold-hi), var(--gold));
      box-shadow: 0 0 10px rgba(244, 181, 63, 0.6);
    }

    .ic:disabled {
      opacity: 0.32;
      cursor: default;
    }

    /* Language switch flash */
    .langflash {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      pointer-events: none;
      font-family: var(--display);
      font-size: 20vmin;
      color: var(--gold);
      opacity: 0;
      white-space: nowrap;
    }

    .langflash.go {
      animation: lf 0.9s ease-out;
    }

    @keyframes lf {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }

      25% {
        opacity: 0.16;
      }

      100% {
        opacity: 0;
        transform: scale(1.08);
      }
    }

    [data-i18n] {
      transition: opacity 0.18s, filter 0.18s, transform 0.18s;
    }

    [data-i18n].out {
      opacity: 0;
      filter: blur(4px);
      transform: translateY(5px);
    }

    .w {
      display: inline-block;
    }

    .slide.on .w {
      animation: wordIn 0.65s both;
      animation-delay: var(--d, 0ms);
    }

    @keyframes wordIn {
      from {
        opacity: 0;
        transform: translateY(0.4em) scale(0.97);
        filter: blur(5px);
        text-shadow: 0 0 16px #ffb02e;
      }

      to {
        opacity: 1;
        transform: none;
        filter: none;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
    }

    /* Artisanal Sticker Animations */
    .stk .flame {
      transform-origin: 60px 54px;
      animation: flick 1.15s ease-in-out infinite alternate;
    }

    @keyframes flick {
      from {
        transform: scale(1, 1) rotate(-2deg);
      }

      to {
        transform: scale(1.06, 1.14) rotate(2deg);
      }
    }

    .spark {
      animation: tw 1.9s ease-in-out infinite;
    }

    .coin {
      transform-box: fill-box;
      transform-origin: center;
      animation: coin 3.4s ease-in-out infinite;
    }

    @keyframes coin {

      0%,
      45% {
        transform: scaleX(1);
      }

      60% {
        transform: scaleX(0.14);
      }

      75%,
      100% {
        transform: scaleX(1);
      }
    }

    .bounce {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: bnc 1.6s ease-in-out infinite;
    }

    @keyframes bnc {
      50% {
        transform: translateY(-5px) scale(1.02, 0.98);
      }
    }

    .swing {
      transform-origin: 60px 4px;
      animation: swg 3s ease-in-out infinite alternate;
    }

    @keyframes swg {
      from {
        transform: rotate(-7deg);
      }

      to {
        transform: rotate(7deg);
      }
    }

    .rays {
      transform-origin: 72px 48px;
      animation: spin 3s linear infinite;
    }

    .rot {
      transform-origin: 60px 60px;
      animation: spin 22s linear infinite;
    }

    /* Sparkle Bursts & Pointer Trail FX */
    #fx {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      overflow: hidden;
    }

    .bit {
      position: absolute;
      width: 11px;
      height: 11px;
      background: var(--c);
      animation: bit 1s ease-out forwards;
      box-shadow: 0 0 8px var(--c);
    }

    .bit.k0 {
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    }

    .bit.k1 {
      border-radius: 65% 0 65% 0;
    }

    .bit.k2 {
      border-radius: 50%;
      width: 7px;
      height: 7px;
    }

    @keyframes bit {
      0% {
        transform: translate(-50%, -50%) scale(0.4);
        opacity: 1;
      }

      65% {
        opacity: 0.95;
      }

      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 42px)) rotate(var(--r)) scale(0.2);
        opacity: 0;
      }
    }

    .trailDot {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, #fff9e6 0%, #ffb838 55%, transparent 100%);
      box-shadow: 0 0 10px #ff9a1f;
      animation: trailFade 0.65s ease-out forwards;
    }

    @keyframes trailFade {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.95;
      }

      100% {
        transform: translate(-50%, calc(-50% + 18px)) scale(0.15);
        opacity: 0;
      }
    }

    /* Falling Marigold & Rose Petals */
    #petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .petal {
      position: absolute;
      top: 0;
      border-radius: 65% 0 65% 15%;
      opacity: 0.82;
      box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.25);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translate(0, -10vh) rotate(0deg);
      }

      25% {
        transform: translate(22px, 25vh) rotate(130deg);
      }

      50% {
        transform: translate(-16px, 52vh) rotate(270deg);
      }

      75% {
        transform: translate(26px, 80vh) rotate(400deg);
      }

      100% {
        transform: translate(0, 112vh) rotate(540deg);
      }
    }

    /* Personalisation Bottom Sheet & Backdrop */
    #sheetBackdrop {
      position: fixed;
      inset: 0;
      z-index: 8;
      background: rgba(10, 2, 5, 0.68);
      backdrop-filter: blur(4px);
    }

    #sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9;
      padding: 22px var(--gy) max(22px, env(safe-area-inset-bottom, 0px)) var(--gx);
      background: linear-gradient(180deg, #4a1022 0%, #240711 100%);
      border-top: 2px solid var(--gold);
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.8), 0 0 24px rgba(255, 150, 40, 0.25);
      border-radius: 26px 26px 0 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
    }

    .sheetHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #sheet h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: 24px;
      color: var(--gold-hi);
    }

    #sheet label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 14px;
      font-weight: 600;
      color: var(--gold-hi);
    }

    #sheet input {
      min-height: 44px;
      border-radius: 12px;
      border: 1.5px solid rgba(232, 168, 56, 0.6);
      background: rgba(18, 4, 9, 0.9);
      color: var(--cream);
      padding: 0 14px;
      font: inherit;
    }

    #fbDiya {
      position: fixed;
      left: 50%;
      top: 44%;
      width: 180px;
      margin-left: -90px;
      z-index: 6;
      display: none;
      transition: all 1.2s;
    }

    @media (max-height: 720px) {
      :root {
        --zone: clamp(96px, 16vh, 150px);
      }

      .stk {
        width: 64px;
      }

      .card {
        padding: 22px 18px 12px;
        gap: 4px;
      }

      .wish {
        font-size: 15px;
        line-height: 1.42;
      }

      .acts .btn {
        min-height: 32px;
        padding: 0 11px;
        font-size: 13px;
      }

      .tag {
        font-size: 21px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Ambient Mandala & Warm Bokeh Background -->
  <div id="ambientBg" aria-hidden="true">
    <svg class="bgMandala" viewBox="0 0 200 200" fill="none" stroke="#f4b53f">
      <circle cx="100" cy="100" r="94" stroke-width="0.8" stroke-dasharray="3 3" />
      <circle cx="100" cy="100" r="78" stroke-width="1" />
      <circle cx="100" cy="100" r="56" stroke-width="0.8" stroke-dasharray="2 4" />
      <circle cx="100" cy="100" r="34" stroke-width="1.2" />
      <g stroke-width="0.9" opacity="0.85">
        <path d="M100 6 C112 36, 112 64, 100 94 C88 64, 88 36, 100 6 Z" />
        <path d="M100 106 C112 136, 112 164, 100 194 C88 164, 88 136, 100 106 Z" />
        <path d="M6 100 C36 112, 64 112, 94 100 C64 88, 36 88, 6 100 Z" />
        <path d="M106 100 C136 112, 164 112, 194 100 C164 88, 136 88, 106 100 Z" />
        <g transform="rotate(45 100 100)">
          <path d="M100 6 C112 36, 112 64, 100 94 C88 64, 88 36, 100 6 Z" />
          <path d="M100 106 C112 136, 112 164, 100 194 C88 164, 88 136, 100 106 Z" />
          <path d="M6 100 C36 112, 64 112, 94 100 C64 88, 36 88, 6 100 Z" />
          <path d="M106 100 C136 112, 164 112, 194 100 C164 88, 136 88, 106 100 Z" />
        </g>
        <g transform="rotate(22.5 100 100)" opacity="0.65">
          <path d="M100 22 C108 46, 108 70, 100 94 C92 70, 92 46, 100 22 Z" />
          <path d="M100 106 C108 130, 108 154, 100 178 C92 154, 92 130, 100 106 Z" />
          <path d="M22 100 C46 108, 70 108, 94 100 C70 92, 46 92, 22 100 Z" />
          <path d="M106 100 C130 108, 154 108, 178 100 C154 92, 130 92, 106 100 Z" />
        </g>
        <g transform="rotate(67.5 100 100)" opacity="0.65">
          <path d="M100 22 C108 46, 108 70, 100 94 C92 70, 92 46, 100 22 Z" />
          <path d="M100 106 C108 130, 108 154, 100 178 C92 154, 92 130, 100 106 Z" />
          <path d="M22 100 C46 108, 70 108, 94 100 C70 92, 46 92, 22 100 Z" />
          <path d="M106 100 C130 108, 154 108, 178 100 C154 92, 130 92, 106 100 Z" />
        </g>
      </g>
    </svg>
  </div>

  <div id="stars" aria-hidden="true"></div>

  <main id="stage" inert>
    <div id="petals" aria-hidden="true"></div>
    <div class="garland" aria-hidden="true"></div>
    <div class="bar">
      <div class="chips" id="chips" role="group" aria-label="Language"></div>
      <button class="ic" id="doorBtn" type="button" aria-label="Show Temple Door & Diya Stairs"
        title="View Temple Door & Diya Stairs">
        <svg viewBox="0 0 24 24">
          <path d="M4 21h16" />
          <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />
          <path d="M12 3v18" />
          <circle cx="10" cy="12" r="0.8" fill="currentColor" />
          <circle cx="14" cy="12" r="0.8" fill="currentColor" />
        </svg>
      </button>
      <button class="ic" id="tourBtn" type="button" aria-pressed="false" aria-label="Play wish in every language"
        title="Switch language automatically">
        <svg viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16" />
          <path d="M3 21v-5h5" />
        </svg>
      </button>
      <button class="ic" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound"

      cam.updateProjectionMatrix();
      const visH = 2 * Math.tan(cam.fov * Math.PI / 360) * 8.02, visW = visH * cam.aspect;
      GL.S0 = Math.min(0.9 * visW, 0.55 * visH) / 5.3;
      const sp = document.getElementById('spacer').getBoundingClientRect();
      const zoneH = sp.height || 180, fy = (sp.top + zoneH / 2) / GL.H, p2w = visH / GL.H;
      GL.S1 = Math.min(GL.S0 * 0.58, (zoneH * 1.25 * p2w) / 5.3);
      GL.yIntro = -0.05 * visH;
      GL.yOpen = 0.3 + (0.5 - fy) * visH / 0.92 - 0.35 * GL.S1;
      if (GL.root && !GL.init) {
        GL.root.position.y = GL.yIntro;

    function frameGL(dt, t) {
      const G = GL;
      if (!G.ok) return;
      const k = 1 - Math.exp(-dt * 3);
      G.flameV += ((G.target - G.flameS) * 70 - G.flameV * 7) * dt;
      G.flameS += G.flameV * dt;
      const fs = Math.max(0, G.flameS);
      const red = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.3 : 1;
      const fl = 1 + red * (0.06 * Math.sin(t * 17) + 0.04 * Math.sin(t * 29 + 1.3) + 0.03 * Math.sin(t * 41));
      G.fm.uniforms.uTime.value = t;
      G.fm.uniforms.uLit.value = fs * fl;
      G.light.intensity = 1.75 * fs * fl;
      G.oil.material.emissiveIntensity = 0.95 * Math.min(fs, 1.2);
      G.pool.material.opacity = 0.35 * Math.min(fs, 1);
      const gs = 3.5 * fs * fl;
      G.glow.scale.set(gs, gs, 1);
      G.glow.material.opacity = Math.min(fs, 1);
      const tS = G.opened ? G.S1 : G.S0, tY = G.opened ? G.yOpen : G.yIntro;
      G.root.scale.setScalar(G.root.scale.x + (tS - G.root.scale.x) * k);
      G.root.position.y += (tY - G.root.position.y) * k;
      G.drag += G.vel;
      G.vel *= Math.exp(-dt * 3);
      if (!G.dragging) G.drag *= Math.exp(-dt * 0.7);
      G.spin.rotation.y = -0.45 + Math.sin(t * 0.6) * 0.3 + G.drag;
      G.root.rotation.x = G.tilt || 0;
      const ep = G.em.geometry.attributes.position, ec = G.em.geometry.attributes.color;
      for (let i = 0; i < G.life.length; i++) {
        G.life[i] += dt * G.spd[i];
        if (G.life[i] > 1) {
          G.life[i] = 0;
          ep.setXYZ(i, (Math.random() - 0.5) * 0.2, 0, (Math.random() - 0.5) * 0.2);
        } else {
          ep.setXYZ(i, ep.getX(i) + Math.sin(G.life[i] * 6 + i) * 0.004, G.life[i] * 3, ep.getZ(i));
        }
        const f = (1 - G.life[i]) * Math.min(fs, 1);
        ec.setXYZ(i, f, f * 0.7, f * 0.35);
      }
      ep.needsUpdate = true;
      ec.needsUpdate = true;
      G.em.visible = fs > 0.05;
      G.r.render(G.scene, G.cam);
      const v = new THREE.Vector3();
      G.fg.getWorldPosition(v);
      v.project(G.cam);
      G.hx = (v.x * 0.5 + 0.5) * G.W;
      G.hy = (-v.y * 0.5 + 0.5) * G.H;
    }

    }

    function setActive(i) {
      if (i === active && slides[i].classList.contains('on')) return;
      slides.forEach((s, j) => { s.classList.toggle('on', j === i); });
      dots.forEach((d, j) => j === i ? d.setAttribute('aria-current', 'true') : d.removeAttribute('aria-current'));
      $('prev').disabled = i === 0;
      $('next').disabled = i === slides.length - 1;
      if (i !== active && started) bell(PENT[i % PENT.length], 0.07);
      active = i;
      updateShare();
    }

    let raf = 0;
    track.addEventListener('scroll', () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const c = track.scrollLeft + track.clientWidth / 2;
        let b = 0, bd = 1e9;
        slides.forEach((s, i) => {
          const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - c);
          if (d < bd) { bd = d; b = i; }
        });
        setActive(b);
      });
    }, { passive: true });

    $('prev').onclick = () => goTo(active - 1);
    $('next').onclick = () => goTo(active + 1);
    track.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(active + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(active - 1); }
    });

    /* Mouse Drag on Slider */
    (function () {
      let dn = false, x0 = 0, s0 = 0;
      track.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse' || e.target.closest('button,a')) return;
        dn = true;
        x0 = e.clientX;
        s0 = track.scrollLeft;
        track.style.scrollSnapType = 'none';
        track.style.cursor = 'grabbing';
      });
      addEventListener('pointermove', e => {
        if (dn) track.scrollLeft = s0 - (e.clientX - x0);
      });
      addEventListener('pointerup', () => {
        if (!dn) return;
        dn = false;
        track.style.scrollSnapType = '';
        track.style.cursor = '';
        goTo(active);
      });
    })();

    /* Tour & Sound */
    function setTour(on) {
      touring = on;
      $('tourBtn').setAttribute('aria-pressed', on);
      clearInterval(tourTimer);
      if (on) {
        const nx = () => setLang(LANGS[(LANGS.findIndex(l => l.k === lang) + 1) % LANGS.length].k);
        nx();
        tourTimer = setInterval(nx, CONFIG.tourMs);
      }
    }
    $('tourBtn').onclick = () => setTour(!touring);

    function paintSound() {
      $('soundBtn').setAttribute('aria-pressed', soundOn);
    }
    $('soundBtn').onclick = () => {
      soundOn = !soundOn;
      try { localStorage.setItem('diwali-sound', soundOn ? '1' : '0'); } catch (e) { }
      paintSound();
      if (soundOn) bell(784, 0.1);
    };
    paintSound();

    /* Share & Personalise (Works on all 6 slides!) */
    function wishText(idx = active) {
      const n = Math.max(1, Math.min(SLIDES.length, idx + 1));
      return `🪔 ${txt('greet')}${state.to ? ', ' + state.to : ''}! 🪔\n\n${txt('s' + n)}\n\n${state.from ? '— ' + state.from : txt('sign')}`;
    }
    function updateShare() {
      document.querySelectorAll('.waBtn').forEach((w, idx) => {
        w.href = 'https://wa.me/?text=' + encodeURIComponent(wishText(idx));
      });
    }
    async function copyText(s) {
      try {
        await navigator.clipboard.writeText(s);
        return true;
      } catch (e) {
        try {
          const t = document.createElement('textarea');
          t.value = s;
          t.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(t);
          t.select();
          const ok = document.execCommand('copy');
          t.remove();
          return ok;
        } catch (_) {
          return false;
        }
      }
    }

    document.querySelectorAll('.copyBtn').forEach((btn, idx) => {
      btn.onclick = async () => {
        const sp = btn.querySelector('.copyLbl');
        const ok = await copyText(wishText(idx));
        if (ok && sp) {
          sp.textContent = txt('copied');
          setTimeout(() => { sp.textContent = txt('copy'); }, 1600);
        }
      };
    });

    function openSheet() {
      $('inTo').value = state.to;
      $('inFrom').value = state.from;
      $('sheetBackdrop').hidden = false;
      $('sheet').hidden = false;
      $('inTo').focus();
    }
    function closeSheet() {
      $('sheetBackdrop').hidden = true;
      $('sheet').hidden = true;
    }
    document.querySelectorAll('.persBtn').forEach(btn => {
      btn.onclick = openSheet;
    });
    $('sheetClose').onclick = closeSheet;
    $('sheetBackdrop').onclick = closeSheet;
    addEventListener('keydown', e => {
      if (e.key === 'Escape' && !$('sheet').hidden) closeSheet();
    });
    $('sheetDone').onclick = () => {
      state.to = clean($('inTo').value.trim());
      state.from = clean($('inFrom').value.trim());
      try { localStorage.setItem('diwali-names', JSON.stringify(state)); } catch (e) { }
      closeSheet();
      applyLang(false);
    };

    /* Sparkle Bursts & Golden Pointer Trail ("Ponytail" / Pointer Trail) */
    const PAL = ['#ffb02e', '#ff7a1a', '#d9386a', '#ffe9a8', '#1ca69e'];
    function burst(x, y, n = 14) {
      if (reduced) n = 4;
      const fx = $('fx');
      for (let i = 0; i < n; i++) {
        const s = document.createElement('i');
        s.className = 'bit k' + (i % 3);
        const a = Math.random() * 6.283, d = 40 + Math.random() * 95;
        s.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 30}px;--r:${Math.random() * 360}deg;--c:${PAL[i % PAL.length]}`;
        fx.appendChild(s);
        setTimeout(() => s.remove(), 1050);
      }
    }

    let lastTrail = 0;
    addEventListener('pointermove', e => {
      if (reduced) return;
      const now = performance.now();
      if (now - lastTrail < 42) return;
      lastTrail = now;
      const dot = document.createElement('i');
      dot.className = 'trailDot';
      dot.style.left = e.clientX + 'px';
      dot.style.top = e.clientY + 'px';
      $('fx').appendChild(dot);
      setTimeout(() => dot.remove(), 650);
    }, { passive: true });

    $('stage').addEventListener('click', e => {
      if (e.target.closest('button,a,input,.chips')) return;
      burst(e.clientX, e.clientY, 12);
      bell(PENT[Math.random() * 6 | 0], 0.05);
    });

    /* Interactive Step Diyas & Door Sequence */
    const intro = $('intro');
    const stepFlames = [...document.querySelectorAll('#doorSteps .flame')];
    stepFlames.forEach((flame, idx) => {
      const diyaEl = flame.parentElement;
      diyaEl.addEventListener('click', e => {
        e.stopPropagation();
        flame.classList.add('flare');
        const rect = flame.getBoundingClientRect();
        burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 10);
        bell(PENT[idx % PENT.length], 0.08);
        setTimeout(() => {
          flame.classList.remove('flare');
        }, 550);
        if (diyaEl.classList.contains('s3-c') && !started) {
          start();
        }
      });
    });

    function flareAllStepDiyas() {
      stepFlames.forEach((flame, idx) => {
        setTimeout(() => {
          flame.classList.add('flare');
          setTimeout(() => flame.classList.remove('flare'), 650);
        }, idx * 75);
      });
    }

    function ticker() {
      const g = $('greetBig');
      let i = 0;
      const other = lang === 'en' ? 'hi' : 'en';
      const seq = [];
      for (let j = 0; j < 6; j++) seq.push(j % 2 ? lang : other);
      const step = () => {
        const k = seq[i];
        g.textContent = I18N[k].greet;
        g.classList.remove('pop');
        void g.offsetWidth;
        g.classList.add('pop');
        i++;
        if (i < seq.length) setTimeout(step, 420);
      };
      step();
    }

    let doorTimer = 0;
    function start() {
      if (started) return;
      started = true;
      ac();
      bell(660, 0.18);
      intro.classList.add('lit');
      flareAllStepDiyas();
      if (GL.ok) GL.target = 1;
      else $('fbDiya').classList.add('lit');
      setTimeout(() => burst(GL.ok ? GL.hx : innerWidth / 2, GL.ok ? GL.hy : innerHeight * 0.45, 18), 320);
      ticker();
      clearTimeout(doorTimer);
      doorTimer = setTimeout(openDoors, 2600);
    }

    function openDoors() {
      bell(1047, 0.12);
      $('doors').style.display = '';
      void $('doors').offsetWidth;
      $('doors').classList.add('open');
      document.body.classList.add('opened');
      $('stage').inert = false;
      GL.opened = true;
      intro.classList.add('gone');
      clearTimeout(doorTimer);
      doorTimer = setTimeout(() => {
        if (GL.opened) {
          $('doors').style.display = 'none';
          $('gl').style.pointerEvents = 'none';
        }
      }, 1700);
    }

    function showDoorEntrance() {
      clearTimeout(doorTimer);
      bell(587, 0.1);
      $('doors').style.display = '';
      void $('doors').offsetWidth;
      $('doors').classList.remove('open');
      document.body.classList.remove('opened');
      $('stage').inert = true;
      GL.opened = false;
      started = false;
      intro.classList.remove('gone', 'lit');
      $('gl').style.pointerEvents = 'auto';
      flareAllStepDiyas();
    }
    $('doorBtn').onclick = showDoorEntrance;
    $('lightBtn').onclick = start;

    /* GL Wiring + Interactive Diya Spin (Both in Intro and via Spacer after Doors Open) */
    GL.ok = initGL();
    if (GL.ok) {
      layoutGL();
      addEventListener('resize', layoutGL);
      const bindSpin = el => {
        let dn = false, lx = 0, mv = 0, t0 = 0;
        el.addEventListener('pointerdown', e => {
          dn = GL.dragging = true;
          lx = e.clientX;
          mv = 0;
          t0 = performance.now();
          try { el.setPointerCapture(e.pointerId); } catch (_) { }
        });
        el.addEventListener('pointermove', e => {
          if (!dn) return;
          const dx = e.clientX - lx;
          lx = e.clientX;
          mv += Math.abs(dx);
          GL.vel = dx * 0.0045;
        });
        el.addEventListener('pointerup', e => {
          if (!dn) return;
          dn = GL.dragging = false;
          if (mv < 8 && performance.now() - t0 < 500) {
            if (!started) start();
            else {
              burst(GL.hx, GL.hy, 14);
              bell(880, 0.08);
            }
          }
        });
      };
      bindSpin($('gl'));
      bindSpin($('spacer'));
    } else {
      const fb = $('fbDiya');
      fb.innerHTML = STK.diya.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
      fb.style.display = 'block';
      $('gl').style.display = 'none';
    }

    const halo = $('halo');
    let last = performance.now(), T = 0;
    function loop(ts) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (ts - last) / 1000);
      last = ts;
      T += dt;
      if (GL.ok) frameGL(dt, T);
      const lit = GL.ok ? Math.min(Math.max(GL.flameS, 0), 1.15) : (started ? 1 : 0);
      const x = GL.ok ? GL.hx : innerWidth / 2, y = GL.ok ? GL.hy : innerHeight * (GL.opened ? 0.2 : 0.45);
      halo.style.opacity = (started ? (0.58 + 0.18 * Math.sin(T * 9) * Math.sin(T * 3.1)) * lit : 0) + '';
      halo.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) scale(${GL.opened ? 0.75 : 1.05})`;
    }
    requestAnimationFrame(loop);
    setLang(lang, false);
    setActive(0);
  </script>
</body>
